name: Pennywise reusable CI

on:
  workflow_call:
    inputs:
      run_e2e: { type: boolean, required: false, default: false }
permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Ephemeral CI-only values used to render and boot the local fixture. They
  # are not deployment credentials and must never be reused outside CI.
  PENNYWISE_SECURITY_CREDENTIAL_DIGEST_SECRET: 'AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=' # local-only CI fixture
  PENNYWISE_SECURITY_AUTH_EMAIL_ENVELOPE_KEY: 'ICEiIyQlJicoKSorLC0uLzAxMjM0NTY3ODk6Ozw9Pj8='

jobs:
  preflight:
    name: Contracts and Compose preflight
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: |
          python3 tools/contracts/validate.py
          python3 tools/contracts/validate_public_surface.py
          docker compose -f infra/local/docker-compose.yml config --quiet
          docker compose -f infra/local/docker-compose.dev.yml config --quiet

  lint:
    name: Lightweight lint and repository checks
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Set up isolated Python tooling
        uses: astral-sh/setup-uv@v6
      - name: Check formatting and contracts
        run: |
          git diff --check
          python3 tools/contracts/validate.py
          python3 tools/contracts/validate_public_surface.py
          python3 -m unittest discover -s tests/acceptance
          make workflow-validate
      - name: Run Python type checker
        run: uvx --from mypy==1.17.1 mypy --config-file mypy.ini tests tools

  verify:
    name: Verify ${{ matrix.kind }} / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: preflight
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: pennywise, POSTGRES_USER: pennywise, POSTGRES_PASSWORD: pennywise }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U pennywise -d pennywise"
          --health-interval=5s --health-timeout=5s --health-retries=12
      rabbitmq:
        image: rabbitmq:4.3-management
        ports: ['5672:5672']
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - { kind: app, name: accounts, path: ':app:accounts' }
          - { kind: app, name: expense-core, path: ':app:expense-core' }
          - { kind: app, name: notifications, path: ':app:notifications' }
          - { kind: app, name: bff, path: ':app:bff' }
          - { kind: library, name: db, path: ':libs:db' }
          - { kind: library, name: errors, path: ':libs:errors' }
          - { kind: library, name: observability, path: ':libs:observability' }
          - { kind: library, name: security, path: ':libs:security' }
          - { kind: library, name: test-support, path: ':libs:test-support' }
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up isolated Python tooling
        uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore shared Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-*
          key: pennywise-gradle-build-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: pennywise-gradle-build-${{ runner.os }}-
      - name: Build, test, check, and coverage
        run: ./gradlew ${{ matrix.path }}:test ${{ matrix.path }}:check jacocoTestReport --no-daemon
      - name: Build application artifact
        if: matrix.kind == 'app'
        run: ./gradlew ${{ matrix.path }}:bootJar --no-daemon
      - name: Upload application jar artifact
        if: matrix.kind == 'app'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ matrix.name }}
          path: app/${{ matrix.name }}/build/libs/pennywise-${{ matrix.name }}-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 5
      - name: Publish test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "**/build/test-results/test/TEST-*.xml"
          show: "fail, skip"
      - name: Upload test results and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    if: inputs.run_e2e
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore shared Gradle build cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-*
          key: pennywise-gradle-e2e-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: pennywise-gradle-e2e-${{ runner.os }}-
      - run: ./gradlew test --no-daemon
      - name: Package application jars for the local stack
        run: ./gradlew bootJar --no-daemon
      - name: Publish E2E test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "**/build/test-results/test/TEST-*.xml"
          show: "fail, skip"
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-e2e
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run contract and deployment smoke checks
        run: bash tests/e2e/contract-smoke.sh
      - name: Start the complete local application stack
        run: docker compose -f infra/local/docker-compose.dev.yml up -d --build --wait
      - name: Diagnose local stack startup failure
        if: failure()
        run: |
          docker compose -f infra/local/docker-compose.dev.yml ps -a
          docker compose -f infra/local/docker-compose.dev.yml logs --no-color --tail=300 \
            accounts expense-core notifications bff postgres rabbitmq mailpit idp-keycloak
      - name: Acquire ephemeral signed local OIDC token
        id: oidc-token
        run: |
          token_response="$(curl --fail-with-body --silent --show-error \
            --connect-to idp-keycloak:8080:127.0.0.1:8090 \
            --data 'grant_type=client_credentials&client_id=pennywise-ci&client_secret=pennywise-ci-local-only' \
            http://idp-keycloak:8080/realms/pennywise/protocol/openid-connect/token)"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$token_response")"
          test -n "$token" || { echo "Keycloak returned no access token"; exit 2; }
          echo "token=$token" >> "$GITHUB_OUTPUT"
          e2e_bob_response="$(curl --fail-with-body --silent --show-error \
            --connect-to idp-keycloak:8080:127.0.0.1:8090 \
            --data 'grant_type=client_credentials&client_id=pennywise-ci-e2e-bob&client_secret=pennywise-ci-e2e-bob-local-only' \
            http://idp-keycloak:8080/realms/pennywise/protocol/openid-connect/token)"
          e2e_bob_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$e2e_bob_response")"
          test -n "$e2e_bob_token" || { echo "Keycloak returned no E2E second-persona token"; exit 2; }
          echo "e2e_bob_token=$e2e_bob_token" >> "$GITHUB_OUTPUT"
          e2e_nonmember_response="$(curl --fail-with-body --silent --show-error \
            --connect-to idp-keycloak:8080:127.0.0.1:8090 \
            --data 'grant_type=client_credentials&client_id=pennywise-ci-e2e-nonmember&client_secret=pennywise-ci-e2e-nonmember-local-only' \
            http://idp-keycloak:8080/realms/pennywise/protocol/openid-connect/token)"
          e2e_nonmember_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$e2e_nonmember_response")"
          test -n "$e2e_nonmember_token" || { echo "Keycloak returned no E2E non-member token"; exit 2; }
          echo "e2e_nonmember_token=$e2e_nonmember_token" >> "$GITHUB_OUTPUT"
          wrong_audience_response="$(curl --fail-with-body --silent --show-error \
            --connect-to idp-keycloak:8080:127.0.0.1:8090 \
            --data 'grant_type=client_credentials&client_id=pennywise-ci-wrong-audience&client_secret=pennywise-ci-wrong-audience-local-only' \
            http://idp-keycloak:8080/realms/pennywise/protocol/openid-connect/token)"
          wrong_audience_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$wrong_audience_response")"
          test -n "$wrong_audience_token" || { echo "Keycloak returned no negative-audience token"; exit 2; }
          echo "wrong_audience_token=$wrong_audience_token" >> "$GITHUB_OUTPUT"
          wrong_issuer_response="$(curl --fail-with-body --silent --show-error \
            --connect-to idp-keycloak:8080:127.0.0.1:8090 \
            --data 'grant_type=client_credentials&client_id=pennywise-ci-wrong-issuer&client_secret=pennywise-ci-wrong-issuer-local-only' \
            http://idp-keycloak:8080/realms/pennywise-other/protocol/openid-connect/token)"
          wrong_issuer_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$wrong_issuer_response")"
          test -n "$wrong_issuer_token" || { echo "Keycloak returned no negative-issuer token"; exit 2; }
          echo "wrong_issuer_token=$wrong_issuer_token" >> "$GITHUB_OUTPUT"
          docker compose -f infra/local/docker-compose.dev.yml exec -T idp-keycloak \
            /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080 \
            --realm master --user local-admin --password local-admin-only
          docker compose -f infra/local/docker-compose.dev.yml exec -T idp-keycloak \
            /opt/keycloak/bin/kcadm.sh update realms/pennywise -s accessTokenLifespan=1
          expiring_response="$(curl --fail-with-body --silent --show-error \
            --connect-to idp-keycloak:8080:127.0.0.1:8090 \
            --data 'grant_type=client_credentials&client_id=pennywise-ci&client_secret=pennywise-ci-local-only' \
            http://idp-keycloak:8080/realms/pennywise/protocol/openid-connect/token)"
          expiring_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$expiring_response")"
          test -n "$expiring_token" || { echo "Keycloak returned no short-lived token"; exit 2; }
          docker compose -f infra/local/docker-compose.dev.yml exec -T idp-keycloak \
            /opt/keycloak/bin/kcadm.sh update realms/pennywise -s accessTokenLifespan=300
          # Spring's default bounded clock skew is 60 seconds; wait beyond it.
          sleep 65
          echo "expired_token=$expiring_token" >> "$GITHUB_OUTPUT"
      - name: Run public-interface acceptance and E2E suites
        env:
          BRUNO_ENV: local-oidc
          BRUNO_TOKEN: ${{ steps.oidc-token.outputs.token }}
          PENNYWISE_BRUNO_TOKEN: ${{ steps.oidc-token.outputs.token }}
          PENNYWISE_BRUNO_WRONG_AUDIENCE_TOKEN: ${{ steps.oidc-token.outputs.wrong_audience_token }}
          PENNYWISE_BRUNO_WRONG_ISSUER_TOKEN: ${{ steps.oidc-token.outputs.wrong_issuer_token }}
          PENNYWISE_BRUNO_EXPIRED_TOKEN: ${{ steps.oidc-token.outputs.expired_token }}
          BEARER_TOKEN: ${{ steps.oidc-token.outputs.token }}
          PENNYWISE_E2E_TOKEN_A: ${{ steps.oidc-token.outputs.token }}
          PENNYWISE_E2E_TOKEN_B: ${{ steps.oidc-token.outputs.e2e_bob_token }}
          PENNYWISE_E2E_TOKEN_NONMEMBER: ${{ steps.oidc-token.outputs.e2e_nonmember_token }}
          WRONG_ISSUER_TOKEN: ${{ steps.oidc-token.outputs.wrong_issuer_token }}
          EXPIRED_TOKEN: ${{ steps.oidc-token.outputs.expired_token }}
        run: |
          make acceptance-live
          make bruno-run BRUNO_ENV="$BRUNO_ENV" BRUNO_TOKEN="$BRUNO_TOKEN"
          python3 tests/e2e/test_oidc_negative.py
          python3 tests/e2e/test_oidc_websocket_negative.py
          docker compose -f infra/local/docker-compose.dev.yml -f infra/local/docker-compose.invalid-subject.yml up -d --build --wait
          invalid_subject_token="$(curl --fail-with-body --silent --show-error -X POST http://localhost:8091/token | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          test -n "$invalid_subject_token"
          INVALID_SUBJECT_TOKEN="$invalid_subject_token" python3 tests/e2e/test_oidc_negative.py
          INVALID_SUBJECT_TOKEN="$invalid_subject_token" BEARER_TOKEN="$BEARER_TOKEN" python3 tests/e2e/test_oidc_websocket_negative.py
          for request in tools/bruno/quality/invalid-subject-accounts.bru tools/bruno/quality/invalid-subject-expense-core.bru tools/bruno/quality/invalid-subject-notifications.bru tools/bruno/quality/invalid-subject-bff.bru; do
            (cd tools/bruno && npx --yes @usebruno/cli@4.1.0 run "../../$request" -r --env local-oidc --env-var "invalidSubjectToken=$invalid_subject_token")
          done
          docker compose -f infra/local/docker-compose.dev.yml -f infra/local/docker-compose.invalid-subject.yml down -v
          docker compose -f infra/local/docker-compose.dev.yml up -d --build --wait
          make e2e-live
          make e2e-offline
          make e2e-concurrency
          make e2e-chaos
          make e2e-rest-edge
      - name: Tear down the complete local application stack
        if: always()
        run: docker compose -f infra/local/docker-compose.dev.yml down -v
