spring:
  application:
    name: expense-core
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: expense-core

pennywise:
  security:
    oidc:
      audience: ${PENNYWISE_SECURITY_OIDC_AUDIENCE:}
  outbox:
    enabled: false
    batch-size: 100
    poll-delay-ms: 1000
    lease-seconds: 30
    max-attempts: 5
    retry-after-seconds: 5
