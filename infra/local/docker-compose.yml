services:
  postgres:
    hostname: ${PENNYWISE_POSTGRES_HOSTNAME:-postgres-db}
    networks:
      default:
        aliases: ["${PENNYWISE_POSTGRES_HOSTNAME:-postgres-db}"]
    image: ${POSTGRES_IMAGE:-postgres:17}
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 256m}
        limits: {cpus: "1.00", memory: 768m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pennywise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pennywise-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-pennywise}
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pennywise} -d pennywise_accounts"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    hostname: ${PENNYWISE_RABBITMQ_HOSTNAME:-message-broker}
    networks:
      default:
        aliases: ["${PENNYWISE_RABBITMQ_HOSTNAME:-message-broker}"]
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3-management}
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 256m}
        limits: {cpus: "1.00", memory: 768m}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pennywise}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pennywise-local-only}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    hostname: ${PENNYWISE_MAILPIT_HOSTNAME:-mailpit-email}
    networks:
      default:
        aliases: ["${PENNYWISE_MAILPIT_HOSTNAME:-mailpit-email}"]
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    deploy:
      resources:
        reservations: {cpus: "0.05", memory: 64m}
        limits: {cpus: "0.25", memory: 256m}
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  idp-keycloak:
    hostname: ${PENNYWISE_IDP_HOSTNAME:-idp-keycloak}
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.4}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-only}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    ports: ["${KEYCLOAK_BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_HOST_PORT:-8090}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
