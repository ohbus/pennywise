spring:
  application:
    name: notifications
  data:
    redis:
      host: ${PENNYWISE_REDIS_HOST}
      port: ${PENNYWISE_REDIS_PORT:6379}
      password: ${PENNYWISE_REDIS_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PENNYWISE_SECURITY_OIDC_ISSUER_URI:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: notifications
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        auto-startup: true

pennywise:
  notifications:
    email:
      host: ${PENNYWISE_NOTIFICATIONS_EMAIL_HOST}
      port: ${PENNYWISE_NOTIFICATIONS_EMAIL_PORT}
      from-address: ${PENNYWISE_NOTIFICATIONS_EMAIL_FROM_ADDRESS}
      enabled: ${PENNYWISE_NOTIFICATIONS_EMAIL_ENABLED}
      max-attempts: ${PENNYWISE_NOTIFICATIONS_EMAIL_MAX_ATTEMPTS:3}
      retry-delay-ms: ${PENNYWISE_NOTIFICATIONS_EMAIL_RETRY_DELAY_MS:0}
  db:
    enabled: ${PENNYWISE_DB_ENABLED:false}
    writer:
      url: ${PENNYWISE_DB_WRITER_URL:${SPRING_DATASOURCE_URL:}}
      username: ${PENNYWISE_DB_WRITER_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
      password: ${PENNYWISE_DB_WRITER_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
      maximum-pool-size: ${PENNYWISE_DB_WRITER_MAX_POOL_SIZE:10}
      connection-timeout-ms: ${PENNYWISE_DB_WRITER_CONNECTION_TIMEOUT_MS:2000}
      max-lifetime-ms: ${PENNYWISE_DB_WRITER_MAX_LIFETIME_MS:1800000}
    readers:
      inbox:
        url: ${PENNYWISE_DB_READER_INBOX_URL:}
        username: ${PENNYWISE_DB_READER_INBOX_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
        password: ${PENNYWISE_DB_READER_INBOX_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
        maximum-pool-size: ${PENNYWISE_DB_READER_INBOX_MAX_POOL_SIZE:5}
        connection-timeout-ms: ${PENNYWISE_DB_READER_INBOX_CONNECTION_TIMEOUT_MS:2000}
        max-lifetime-ms: ${PENNYWISE_DB_READER_INBOX_MAX_LIFETIME_MS:1800000}
  security:
    oidc:
      audience: ${PENNYWISE_SECURITY_OIDC_AUDIENCE:}
