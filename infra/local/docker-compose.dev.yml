services:
  postgres:
    extends: {file: docker-compose.yml, service: postgres}
  rabbitmq:
    extends: {file: docker-compose.yml, service: rabbitmq}
  mailpit:
    extends: {file: docker-compose.yml, service: mailpit}
  accounts:
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 192m}
        limits: {cpus: "1.00", memory: 512m}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fast
      args: {APP_PROJECT: accounts}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pennywise_accounts
      SPRING_DATASOURCE_USERNAME: pennywise
      SPRING_DATASOURCE_PASSWORD: pennywise-local-only
    ports: ["8081:8080"]
    depends_on: {postgres: {condition: service_healthy}}
  expense-core:
    deploy:
      resources:
        reservations: {cpus: "0.50", memory: 256m}
        limits: {cpus: "1.50", memory: 768m}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fast
      args: {APP_PROJECT: expense-core}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pennywise_expense_core
      SPRING_DATASOURCE_USERNAME: pennywise
      SPRING_DATASOURCE_PASSWORD: pennywise-local-only
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: pennywise
      SPRING_RABBITMQ_PASSWORD: pennywise-local-only
      PENNYWISE_OUTBOX_ENABLED: "true"
      PENNYWISE_OUTBOX_RABBIT_ENABLED: "true"
    ports: ["8082:8080"]
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}}
  notifications:
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 192m}
        limits: {cpus: "1.00", memory: 512m}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fast
      args: {APP_PROJECT: notifications}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pennywise_notifications
      SPRING_DATASOURCE_USERNAME: pennywise
      SPRING_DATASOURCE_PASSWORD: pennywise-local-only
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: pennywise
      SPRING_RABBITMQ_PASSWORD: pennywise-local-only
      PENNYWISE_NOTIFICATIONS_EMAIL_HOST: mailpit
      PENNYWISE_NOTIFICATIONS_EMAIL_PORT: 1025
    ports: ["8083:8080"]
    depends_on: {postgres: {condition: service_healthy}, rabbitmq: {condition: service_healthy}, mailpit: {condition: service_healthy}}
  bff:
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 192m}
        limits: {cpus: "1.00", memory: 512m}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.fast
      args: {APP_PROJECT: bff}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: pennywise
      SPRING_RABBITMQ_PASSWORD: pennywise-local-only
      PENNYWISE_EXPENSE_CORE_URL: http://expense-core:8080
      PENNYWISE_ACCOUNTS_URL: http://accounts:8080
    ports: ["8080:8080"]
    depends_on: [accounts, expense-core, notifications]
