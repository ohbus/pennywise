services:
  postgres:
    image: postgres:17
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 256m}
        limits: {cpus: "1.00", memory: 768m}
    environment:
      POSTGRES_USER: pennywise
      POSTGRES_PASSWORD: pennywise-local-only
      POSTGRES_DB: pennywise
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennywise"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.3-management
    deploy:
      resources:
        reservations: {cpus: "0.25", memory: 256m}
        limits: {cpus: "1.00", memory: 768m}
    environment:
      RABBITMQ_DEFAULT_USER: pennywise
      RABBITMQ_DEFAULT_PASS: pennywise-local-only
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    deploy:
      resources:
        reservations: {cpus: "0.05", memory: 64m}
        limits: {cpus: "0.25", memory: 256m}
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
