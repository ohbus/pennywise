name: Pennywise branch CI
on:
  push:
    branches-ignore: [master]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pennywise-branch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Feature branch verification (reusable)
    uses: ./.github/workflows/_reusable-ci.yml
    with: { run_e2e: true }
