<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Squarewise logo</title>
  <desc id="desc">Overlapping rounded squares in blue and teal beside the Squarewise wordmark.</desc>
  <defs>
    <linearGradient id="blueGradient" x1="40" y1="70" x2="220" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F49F5"/>
      <stop offset="1" stop-color="#4F7CFF"/>
    </linearGradient>
    <linearGradient id="tealGradient" x1="110" y1="40" x2="250" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25C8A1"/>
      <stop offset="1" stop-color="#55DFB6"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="750" y1="0" x2="1060" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20B98F"/>
      <stop offset="1" stop-color="#0F9F79"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1F55" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g transform="translate(30 35)" filter="url(#softShadow)">
    <rect x="18" y="72" width="150" height="150" rx="30" fill="url(#blueGradient)"/>
    <rect x="76" y="22" width="150" height="150" rx="30" fill="url(#tealGradient)"/>
    <rect x="77" y="83" width="92" height="92" rx="24" fill="#0B2A68" fill-opacity="0.68"/>
  </g>

  <text x="300" y="205"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="146"
        font-weight="760"
        letter-spacing="-7">
    <tspan fill="#071B4B">Square</tspan><tspan fill="url(#wordGradient)">wise</tspan>
  </text>
</svg>
