spring:
  application:
    name: notifications
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PENNYWISE_SECURITY_OIDC_ISSUER_URI:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: notifications
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        auto-startup: true

pennywise:
  security:
    oidc:
      audience: ${PENNYWISE_SECURITY_OIDC_AUDIENCE:}
