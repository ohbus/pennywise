spring:
  application:
    name: accounts
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PENNYWISE_SECURITY_OIDC_ISSUER_URI:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: accounts

pennywise:
  db:
    enabled: ${PENNYWISE_DB_ENABLED:false}
    writer:
      url: ${PENNYWISE_DB_WRITER_URL:${SPRING_DATASOURCE_URL:}}
      username: ${PENNYWISE_DB_WRITER_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
      password: ${PENNYWISE_DB_WRITER_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
      maximum-pool-size: ${PENNYWISE_DB_WRITER_MAX_POOL_SIZE:10}
      connection-timeout-ms: ${PENNYWISE_DB_WRITER_CONNECTION_TIMEOUT_MS:2000}
      max-lifetime-ms: ${PENNYWISE_DB_WRITER_MAX_LIFETIME_MS:1800000}
    readers:
      profile:
        url: ${PENNYWISE_DB_READER_PROFILE_URL:}
        username: ${PENNYWISE_DB_READER_PROFILE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
        password: ${PENNYWISE_DB_READER_PROFILE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
        maximum-pool-size: ${PENNYWISE_DB_READER_PROFILE_MAX_POOL_SIZE:5}
        connection-timeout-ms: ${PENNYWISE_DB_READER_PROFILE_CONNECTION_TIMEOUT_MS:2000}
        max-lifetime-ms: ${PENNYWISE_DB_READER_PROFILE_MAX_LIFETIME_MS:1800000}
  security:
    oidc:
      audience: ${PENNYWISE_SECURITY_OIDC_AUDIENCE:}
