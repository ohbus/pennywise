spring:
  application:
    name: bff
  codec:
    max-in-memory-size: ${SQUAREWISE_BFF_MAX_BODY_SIZE:256KB}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SQUAREWISE_SECURITY_OIDC_ISSUER_URI:}
  graphql:
    path: /graphql
    schema:
      locations: classpath:graphql/
    websocket:
      path: /graphql

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: bff

server:
  max-http-request-header-size: ${SQUAREWISE_BFF_MAX_HEADER_SIZE:16KB}

squarewise:
  accounts-url: ${SQUAREWISE_ACCOUNTS_URL}
  expense-core-url: ${SQUAREWISE_EXPENSE_CORE_URL}
  security:
    oidc:
      audience: ${SQUAREWISE_SECURITY_OIDC_AUDIENCE:}
